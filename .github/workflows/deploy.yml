name: Deploy

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Installs icp-cli and ic-wasm too: both are devDependencies, so they are
      # version-pinned in the lock file and restored from the npm cache rather
      # than downloaded unpinned on every run. There is no official setup
      # action for icp-cli.
      - name: Prepare
        uses: ./.github/actions/prepare

      # Needed only for the profiles canister.
      - name: Install the Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The identity is a controller of the profiles canister — upgrading a
      # canister's wasm is controller-only — and holds only the `Commit`
      # permission on the frontend asset canister, which is all publishing
      # assets needs. It is deliberately not a controller of the frontend.
      - name: Import deploy identity
        env:
          DEPLOY_PEM: ${{ secrets.DEPLOY_PEM }}
        run: |
          if [[ -z "$DEPLOY_PEM" ]]; then
            echo "::error::Missing DEPLOY_PEM secret."
            exit 1
          fi
          umask 077
          printf '%s' "$DEPLOY_PEM" > "$RUNNER_TEMP/deploy.pem"
          # `keyring` is the default store and is unavailable on a CI runner.
          npx icp identity import --from-pem "$RUNNER_TEMP/deploy.pem" --storage plaintext deploy
          npx icp identity default deploy

      # Backend first, so the frontend never ships ahead of the interface it
      # calls.
      - name: Deploy the profiles canister
        run: npm run deploy:profiles

      # `icp sync` rather than `icp deploy`: deploy also updates canister
      # settings, which only controllers may do.
      - name: Publish the frontend
        run: npm run deploy:assets

      - name: Remove deploy identity
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy.pem"
