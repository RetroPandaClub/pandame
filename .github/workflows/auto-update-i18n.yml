name: Auto Update i18n

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'src/lib/i18n/*'
      - 'src/lib/types/i18n.d.ts'

permissions: {}

jobs:
  auto_update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check if commits can be added
        id: check_can_add_commit
        run: |
          echo "can_add_commit=$CAN_ADD_COMMIT" >> $GITHUB_OUTPUT
        env:
          CAN_ADD_COMMIT: ${{ secrets.BOT_CREATE_PR_PAT != '' }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.BOT_CREATE_PR_PAT || github.token }}
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Run i18n script
        run: npm run i18n

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit i18n
        if: steps.check_changes.outputs.changes_detected == 'true' && steps.check_can_add_commit.outputs.can_add_commit == 'true'
        uses: ./.github/actions/add-and-commit
        with:
          message: '🤖 Updated i18n files'
          token: ${{ secrets.BOT_CREATE_PR_PAT }}
