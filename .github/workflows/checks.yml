name: Checks

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  format:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check if commits can be added
        id: check_can_add_commit
        run: |
          echo "can_add_commit=$CAN_ADD_COMMIT" >> $GITHUB_OUTPUT
        env:
          CAN_ADD_COMMIT: ${{ secrets.BOT_CREATE_PR_PAT != '' && github.event_name == 'pull_request' }}

      - name: Checkout for pull request
        if: steps.check_can_add_commit.outputs.can_add_commit == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.BOT_CREATE_PR_PAT }}
          persist-credentials: false

      - name: Checkout
        if: steps.check_can_add_commit.outputs.can_add_commit == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Format
        run: npm run format

      - name: Check for Changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit format
        if: steps.check_changes.outputs.changes_detected == 'true' && steps.check_can_add_commit.outputs.can_add_commit == 'true'
        uses: ./.github/actions/add-and-commit
        with:
          message: '🤖 Apply formatting changes'
          token: ${{ secrets.BOT_CREATE_PR_PAT }}

      - name: Fail for formatting changes that cannot be committed
        if: steps.check_can_add_commit.outputs.can_add_commit == 'false' && steps.check_changes.outputs.changes_detected == 'true'
        run: |
          echo "::error::Formatting changes are needed but couldn't be committed: this isn't a pull request, or BOT_CREATE_PR_PAT isn't available (it must exist as both an Actions and a Dependabot secret)."
          git status --porcelain
          exit 1

  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Lint
        run: npm run lint

  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Check
        run: npm run check

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Test
        run: npm run test -- --run

  canister:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check if commits can be added
        id: check_can_add_commit
        run: |
          echo "can_add_commit=$CAN_ADD_COMMIT" >> $GITHUB_OUTPUT
        env:
          CAN_ADD_COMMIT: ${{ secrets.BOT_CREATE_PR_PAT != '' && github.event_name == 'pull_request' }}

      - name: Checkout for pull request
        if: steps.check_can_add_commit.outputs.can_add_commit == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.BOT_CREATE_PR_PAT }}
          persist-credentials: false

      - name: Checkout
        if: steps.check_can_add_commit.outputs.can_add_commit == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown --release --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --check

      # The TypeScript declarations and IDL factories are generated from the
      # .did, so checking only the .did would let CI pass while the frontend
      # still compiled against stale bindings and failed at the wire boundary.
      # Regenerate the whole chain (a bindgen bump alone changes every file) and
      # commit it back; formatting stays with the format job.
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate the Candid interface and its bindings
        run: |
          cargo install candid-extractor --locked
          cargo build --target wasm32-unknown-unknown --release -p profiles
          candid-extractor target/wasm32-unknown-unknown/release/profiles.wasm \
            > src/declarations/profiles/profiles.did
          ./scripts/compile-idl-js.sh --staging

      - name: Check for Changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain -- src/declarations/)" ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit bindings
        if: steps.check_changes.outputs.changes_detected == 'true' && steps.check_can_add_commit.outputs.can_add_commit == 'true'
        uses: ./.github/actions/add-and-commit
        with:
          add: src/declarations
          message: '🤖 Regenerate bindings'
          token: ${{ secrets.BOT_CREATE_PR_PAT }}

      - name: Fail for bindings changes that cannot be committed
        if: steps.check_can_add_commit.outputs.can_add_commit == 'false' && steps.check_changes.outputs.changes_detected == 'true'
        run: |
          echo "::error::src/declarations/ is out of date and couldn't be committed: this isn't a pull request, or BOT_CREATE_PR_PAT isn't available (it must exist as both an Actions and a Dependabot secret). Run 'cargo build', re-extract the Candid interface, then './scripts/compile-idl-js.sh --staging' and commit the result."
          git --no-pager diff -- src/declarations/
          exit 1

  checks-pass:
    if: always()
    needs: ['format', 'lint', 'check', 'build', 'test', 'canister']
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/needs_success
        with:
          needs: '${{ toJson(needs) }}'
