name: Update E2E Snapshots

on:
  workflow_dispatch:

permissions: {}

jobs:
  update_snapshots:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Fail if branch is main
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          echo "This workflow should not be triggered on main"
          exit 1

      - name: Check if commits can be added
        id: check_can_add_commit
        run: |
          echo "can_add_commit=$CAN_ADD_COMMIT" >> $GITHUB_OUTPUT
        env:
          CAN_ADD_COMMIT: ${{ secrets.BOT_CREATE_PR_PAT != '' }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BOT_CREATE_PR_PAT || github.token }}
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Install Playwright
        uses: ./.github/actions/playwright-install

      - name: Run Playwright snapshot update
        run: npm run e2e:snapshots

      - name: Commit Playwright updated snapshots
        if: steps.check_can_add_commit.outputs.can_add_commit == 'true'
        uses: ./.github/actions/add-and-commit
        with:
          add: e2e
          message: '🤖 Update snapshots'
          token: ${{ secrets.BOT_CREATE_PR_PAT }}
